services:
  - type: web
    name: psl-side-inference
    env: python
    rootDir: .
    plan: starter
    buildCommand: pip install -r side_inference_service/requirements.txt
    startCommand: uvicorn side_inference_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SIDE_SERVICE_MAX_FILE_SIZE
        value: "10485760"
      - key: SIDE_SERVICE_MAX_IMAGE_DIMENSION
        value: "4096"
      - key: SIDE_SERVICE_CALIBRATION_MODEL_PATH
        value: ""
